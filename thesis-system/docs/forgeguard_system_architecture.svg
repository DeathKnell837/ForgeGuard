<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" width="1000" height="920" style="background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="2" />
      <feComponentTransfer><feFuncA type="linear" slope="0.08" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="0" dy="1.5" />
      <feComponentTransfer><feFuncA type="linear" slope="0.06" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="920" fill="#F8FAFC" />

  <!-- Top Banner -->
  <rect x="40" y="24" width="920" height="52" rx="8" fill="#0F172A" filter="url(#box-shadow)" />
  <text x="60" y="55" fill="#FFFFFF" font-size="16" font-weight="700" letter-spacing="0.5">FORGEGUARD: 4-TIER WEB APPLICATION ARCHITECTURE</text>
  <text x="940" y="55" fill="#94A3B8" font-size="12" font-weight="500" text-anchor="end">NDMC BSCS THESIS RESEARCH</text>

  <!-- ==================== TIER 1: CLIENT TIER ==================== -->
  <g transform="translate(40, 96)">
    <rect width="920" height="114" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#box-shadow)" />
    <!-- Tier Badge -->
    <rect x="16" y="12" width="180" height="26" rx="4" fill="#DBEAFE" />
    <text x="26" y="29" fill="#1D4ED8" font-size="11" font-weight="700">TIER 1: CLIENT LAYER</text>

    <!-- Card 1: User -->
    <g transform="translate(20, 48)">
      <rect width="420" height="52" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)" />
      <circle cx="30" cy="26" r="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
      <circle cx="30" cy="21" r="5" fill="#3B82F6" />
      <path d="M 21 32 C 21 27 39 27 39 32" stroke="#3B82F6" stroke-width="1.6" fill="none" />
      <text x="56" y="24" fill="#0F172A" font-size="12.5" font-weight="700">End User / Online Merchant</text>
      <text x="56" y="40" fill="#64748B" font-size="11">Submits GCash transaction receipts for fraud analysis</text>
    </g>

    <!-- Card 2: Browser -->
    <g transform="translate(480, 48)">
      <rect width="420" height="52" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)" />
      <rect x="18" y="14" width="24" height="24" rx="4" fill="#3B82F6" />
      <path d="M 23 26 L 27 21 L 37 31" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" />
      <text x="56" y="24" fill="#0F172A" font-size="12.5" font-weight="700">Client Web Browser</text>
      <text x="56" y="40" fill="#64748B" font-size="11">Chrome, Edge, Safari (HTML5 / CSS / WebSockets)</text>
    </g>
  </g>

  <!-- Bidirectional Connection 1 <-> 2 -->
  <line x1="500" y1="210" x2="500" y2="242" stroke="#2563EB" stroke-width="2" />
  <polygon points="495, 217 500, 210 505, 217" fill="#2563EB" />
  <polygon points="495, 235 500, 242 505, 235" fill="#2563EB" />
  <rect x="420" y="217" width="160" height="18" rx="3" fill="#FFFFFF" stroke="#BFDBFE" />
  <text x="500" y="230" fill="#1D4ED8" font-size="10" font-weight="600" text-anchor="middle">HTTPS / WebSockets</text>

  <!-- ==================== TIER 2: PRESENTATION TIER ==================== -->
  <g transform="translate(40, 244)">
    <rect width="920" height="136" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" filter="url(#box-shadow)" />
    <!-- Tier Badge -->
    <rect x="16" y="12" width="280" height="26" rx="4" fill="#DCFCE7" />
    <text x="26" y="29" fill="#15803D" font-size="11" font-weight="700">TIER 2: PRESENTATION LAYER (Streamlit UI)</text>

    <!-- Module 1 -->
    <g transform="translate(20, 48)">
      <rect width="280" height="74" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)" />
      <text x="16" y="24" fill="#0F172A" font-size="12" font-weight="700">Evidence Ingestion</text>
      <text x="16" y="44" fill="#64748B" font-size="11">&#8226; Drag-and-drop file dropzone</text>
      <text x="16" y="62" fill="#64748B" font-size="11">&#8226; 1-click test receipt presets</text>
    </g>

    <!-- Module 2 -->
    <g transform="translate(320, 48)">
      <rect width="280" height="74" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)" />
      <text x="16" y="24" fill="#0F172A" font-size="12" font-weight="700">Tri-Spectral Viewer</text>
      <text x="16" y="44" fill="#64748B" font-size="11">&#8226; Synchronized original display</text>
      <text x="16" y="62" fill="#64748B" font-size="11">&#8226; ELA residual &amp; heatmap overlay</text>
    </g>

    <!-- Module 3 -->
    <g transform="translate(620, 48)">
      <rect width="280" height="74" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)" />
      <text x="16" y="24" fill="#0F172A" font-size="12" font-weight="700">Benchmark Dashboard</text>
      <text x="16" y="44" fill="#64748B" font-size="11">&#8226; Confusion matrix &amp; accuracy</text>
      <text x="16" y="62" fill="#64748B" font-size="11">&#8226; Multi-model latency gauges</text>
    </g>
  </g>

  <!-- Bidirectional Connection 2 <-> 3 -->
  <line x1="500" y1="380" x2="500" y2="412" stroke="#2563EB" stroke-width="2" />
  <polygon points="495, 387 500, 380 505, 387" fill="#2563EB" />
  <polygon points="495, 405 500, 412 505, 405" fill="#2563EB" />
  <rect x="410" y="387" width="180" height="18" rx="3" fill="#FFFFFF" stroke="#BFDBFE" />
  <text x="500" y="400" fill="#1D4ED8" font-size="10" font-weight="600" text-anchor="middle">Internal Python Function Calls</text>

  <!-- ==================== TIER 3: APPLICATION & INFERENCE TIER ==================== -->
  <g transform="translate(40, 414)">
    <rect width="920" height="236" rx="10" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.5" filter="url(#box-shadow)" />
    <!-- Tier Badge -->
    <rect x="16" y="12" width="360" height="26" rx="4" fill="#F3E8FF" />
    <text x="26" y="29" fill="#7E22CE" font-size="11" font-weight="700">TIER 3: APPLICATION &amp; INFERENCE LAYER (Python Backend)</text>

    <!-- Subsystem 3.1: Image Forensics Engine -->
    <g transform="translate(20, 48)">
      <rect width="425" height="172" rx="8" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1" filter="url(#card-shadow)" />
      <rect x="12" y="10" width="220" height="20" rx="3" fill="#F3E8FF" />
      <text x="20" y="24" fill="#7E22CE" font-size="10" font-weight="700">IMAGE FORENSICS (Pillow / OpenCV)</text>

      <text x="16" y="52" fill="#0F172A" font-size="11.5" font-weight="700">1. Image Validation &amp; Ingestion</text>
      <text x="16" y="68" fill="#64748B" font-size="10.5">Validates aspect ratios, RGB channels &amp; file format</text>

      <text x="16" y="94" fill="#0F172A" font-size="11.5" font-weight="700">2. Error Level Analysis (ELA 90Q Engine)</text>
      <text x="16" y="110" fill="#64748B" font-size="10.5">Re-saves at Q=90, extracts error matrix &amp; scales by 15.0&#215;</text>

      <text x="16" y="136" fill="#0F172A" font-size="11.5" font-weight="700">3. Tamper Heatmap Localization</text>
      <text x="16" y="152" fill="#64748B" font-size="10.5">OpenCV JET colormap overlay &amp; bounding box ROI</text>
    </g>

    <!-- Subsystem 3.2: CNN Inference Engine -->
    <g transform="translate(475, 48)">
      <rect width="425" height="172" rx="8" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1" filter="url(#card-shadow)" />
      <rect x="12" y="10" width="220" height="20" rx="3" fill="#F3E8FF" />
      <text x="20" y="24" fill="#7E22CE" font-size="10" font-weight="700">CNN INFERENCE (TensorFlow / Keras)</text>

      <text x="16" y="50" fill="#0F172A" font-size="11.5" font-weight="700">MobileNetV2 <tspan font-weight="600" fill="#7E22CE">(SOP-5 Primary Model)</tspan></text>
      <text x="16" y="66" fill="#64748B" font-size="10.5">3.4M params &#8226; Inverted residuals &#8226; 28.04 ms mobile latency</text>

      <text x="16" y="88" fill="#0F172A" font-size="11.5" font-weight="700">Basic CNN <tspan font-weight="600" fill="#6366F1">(Baseline Architecture)</tspan></text>
      <text x="16" y="104" fill="#64748B" font-size="10.5">2.1M params &#8226; 4 Convolutional layers &#8226; 8.61 ms inference</text>

      <text x="16" y="126" fill="#0F172A" font-size="11.5" font-weight="700">ResNet50 <tspan font-weight="600" fill="#A855F7">(Deep Residual Model)</tspan></text>
      <text x="16" y="142" fill="#64748B" font-size="10.5">23.5M params &#8226; 50 Layers with skip connections &#8226; 109.34 ms</text>

      <text x="16" y="162" fill="#15803D" font-size="10" font-weight="700">Consensus Engine: Soft-voting agreement aggregation</text>
    </g>
  </g>

  <!-- Bidirectional Connection 3 <-> 4 -->
  <line x1="500" y1="650" x2="500" y2="682" stroke="#2563EB" stroke-width="2" />
  <polygon points="495, 657 500, 650 505, 657" fill="#2563EB" />
  <polygon points="495, 675 500, 682 505, 675" fill="#2563EB" />
  <rect x="410" y="657" width="180" height="18" rx="3" fill="#FFFFFF" stroke="#BFDBFE" />
  <text x="500" y="670" fill="#1D4ED8" font-size="10" font-weight="600" text-anchor="middle">Model I/O &amp; Metadata Reads</text>

  <!-- ==================== TIER 4: DATA & STORAGE TIER ==================== -->
  <g transform="translate(40, 684)">
    <rect width="920" height="186" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" filter="url(#box-shadow)" />
    <!-- Tier Badge -->
    <rect x="16" y="12" width="280" height="26" rx="4" fill="#FEF3C7" />
    <text x="26" y="29" fill="#B45309" font-size="11" font-weight="700">TIER 4: DATA &amp; STORAGE LAYER (Persistence)</text>

    <!-- Storage Card 1: Weights -->
    <g transform="translate(20, 48)">
      <rect width="280" height="124" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)" />
      <text x="16" y="24" fill="#0F172A" font-size="12" font-weight="700">Trained Weights (.keras)</text>
      <text x="16" y="46" fill="#64748B" font-size="11">&#8226; <tspan font-family="monospace">mobilenetv2.keras</tspan> (14 MB)</text>
      <text x="16" y="66" fill="#64748B" font-size="11">&#8226; <tspan font-family="monospace">basic_cnn.keras</tspan> (8.5 MB)</text>
      <text x="16" y="86" fill="#64748B" font-size="11">&#8226; <tspan font-family="monospace">resnet50.keras</tspan> (98 MB)</text>
      <text x="16" y="108" fill="#B45309" font-size="10" font-weight="600">Local serialized neural models</text>
    </g>

    <!-- Storage Card 2: Metrics -->
    <g transform="translate(320, 48)">
      <rect width="280" height="124" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)" />
      <text x="16" y="24" fill="#0F172A" font-size="12" font-weight="700">Evaluation Metrics &amp; Logs</text>
      <text x="16" y="46" fill="#64748B" font-size="11">&#8226; <tspan font-family="monospace">evaluation_metrics.json</tspan></text>
      <text x="16" y="66" fill="#64748B" font-size="11">&#8226; Confusion matrices (TP, TN, FP, FN)</text>
      <text x="16" y="86" fill="#64748B" font-size="11">&#8226; Model latency logs per epoch</text>
      <text x="16" y="108" fill="#B45309" font-size="10" font-weight="600">Validated empirical performance data</text>
    </g>

    <!-- Storage Card 3: Dataset -->
    <g transform="translate(620, 48)">
      <rect width="280" height="124" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)" />
      <text x="16" y="24" fill="#0F172A" font-size="12" font-weight="700">Empirical Dataset (N = 777)</text>
      <text x="16" y="46" fill="#15803D" font-size="11" font-weight="600">&#8226; 153 Authentic GCash Receipts</text>
      <text x="16" y="66" fill="#DC2626" font-size="11" font-weight="600">&#8226; 624 Forged Receipts (4 Vectors)</text>
      <text x="16" y="86" fill="#64748B" font-size="11">&#8226; Amount, Reference, Name, AI Synth</text>
      <text x="16" y="108" fill="#B45309" font-size="10" font-weight="600">Dataset metadata catalog (.json)</text>
    </g>
  </g>

</svg>